[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "passive-aggressive-reminder-bot"
version = "0.2.0"
description = "Generate reminders with configurable sass and personality"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Author"}]
requires-python = ">=3.8"
keywords = ["cli", "reminders", "passive-aggressive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
passive-aggressive-reminder-bot = "passive_aggressive_reminder_bot.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/passive-aggressive-reminder-bot"
Repository = "https://github.com/yourusername/passive-aggressive-reminder-bot.git"

[tool.setuptools]
packages = ["passive_aggressive_reminder_bot"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

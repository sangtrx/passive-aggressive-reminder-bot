name: API

on:
  push:
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enterprise.txt || true
      - name: Run API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from passive_aggressive_reminder_bot.api import app
          client = TestClient(app)
          r = client.post('/remind', json={'message':'test','spice':2})
          assert r.status_code == 200
          print(r.json())
          PY

version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      - redis
    command: uvicorn "passive_aggressive_reminder_bot.api:create_app" --factory --host 0.0.0.0 --port 8000
version: "3.8"
services:
  app:
    build: .
    image: passive-aggressive-reminder-bot:latest
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
